; Eli's face on an ESP32-S3: `pio run -t upload && pio device monitor`
; Board: ESP32-S3-DevKitC-1 N8R8 (8 MB flash, 8 MB octal PSRAM). For an N16R8 the same settings work.
; For a quad-PSRAM module (N8R2, N4R2) set board_build.arduino.memory_type = qio_qspi and remove psram_type.
[env:eli]
platform = espressif32 @ ^6.9.0   ; Arduino core 2.0.x (legacy I2S driver, LEDC v2 API; v3 is shimmed)
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINOJSON_ENABLE_STD_STRING=1
monitor_speed = 115200
lib_deps =
  olikraus/U8g2 @ ^2.35.30
  bblanchon/ArduinoJson @ ^7.2.0
