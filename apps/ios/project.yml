# xcodegen spec: `xcodegen` here generates Eli.xcodeproj (gitignored) and Eli/Info.plist.
name: Eli
options:
  bundleIdPrefix: com.adrbn
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 2TWQF4T93E
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
targets:
  Eli:
    type: application
    platform: iOS
    sources: [Eli]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adrbn.eli
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Eli/Info.plist
      properties:
        CFBundleDisplayName: Eli
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Eli listens to you when you talk to it.
        NSLocalNetworkUsageDescription: Eli connects to its server on your network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
